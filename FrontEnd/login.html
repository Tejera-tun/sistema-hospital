
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLEM | Inicio de sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --verde: #075c45;
            --verde-oscuro: #064735;
            --dorado: #d4af37;
            --fondo: #f4f8f6;
        }

        body {
            min-height: 100vh;
            background: var(--fondo);
            font-family: Arial, sans-serif;
        }

        .navbar-flem {
            background: var(--verde);
            padding: 12px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            text-decoration: none;
        }

        .logo-hospital {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand-text {
            color: white;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .brand-text .flem,
        .brand-text .cruz {
            color: var(--dorado);
        }

        .brand-text small {
            display: block;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .login-container {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        .login-card .card-body {
            padding: 40px;
        }

        .medical-symbol {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #f8f1d9;
            color: var(--dorado);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin: 0 auto 18px;
        }

        .flem-title {
            color: var(--verde);
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #78847e;
        }

        .form-label {
            color: #34443c;
        }

        .form-control {
            border-radius: 9px;
            padding: 12px;
            border: 1px solid #d8e1dc;
        }

        .form-control:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(7, 92, 69, .12);
        }

        .btn-flem {
            background: var(--verde);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 13px;
            font-weight: bold;
            transition: .2s;
        }

        .btn-flem:hover {
            background: var(--verde-oscuro);
            color: white;
        }

        .register-link {
            color: var(--verde);
        }

        .register-link:hover {
            color: var(--verde-oscuro);
            text-decoration: underline !important;
        }

        .gold-line {
            width: 55px;
            height: 4px;
            background: var(--dorado);
            border-radius: 5px;
            margin: 15px auto 20px;
        }

        @media (max-width: 500px) {
            .logo-hospital {
                width: 38px;
                height: 38px;
            }

            .brand-text {
                font-size: 19px;
            }

            .brand-text small {
                font-size: 9px;
            }

            .login-card .card-body {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-flem">
        <div class="container">

            <a href="login.html" class="brand">

                <img
                    src="img/logo-hospital-clinicas.png"
                    alt="Logo Hospital de Clínicas"
                    class="logo-hospital"
                >

                <span class="brand-text">
                    <span class="flem">FLEM</span><span class="cruz"> ×</span>
                    <small>HOSPITAL DE CLÍNICAS</small>
                </span>

            </a>

        </div>
    </nav>

    <main class="login-container">

        <div class="card login-card">

            <div class="card-body">

                <div class="text-center mb-4">

                    <div class="medical-symbol">
                        ⚕
                    </div>

                    <h1 class="flem-title">FLEM</h1>

                    <div class="gold-line"></div>

                    <p class="subtitle">
                        Sistema de gestión hospitalaria
                    </p>

                    <p class="text-secondary small">
                        Ingresá tus datos para acceder a tu cuenta.
                    </p>

                </div>

                <form action="../BackEnd/login.php" method="POST">

                    <div class="mb-3">

                        <label for="correo" class="form-label fw-semibold">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label for="password" class="form-label fw-semibold">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-flem btn-lg"
                        >
                            Iniciar sesión
                        </button>

                    </div>

                </form>

                <div class="text-center mt-4">

                    <span class="text-secondary">
                        ¿No tenés una cuenta?
                    </span>

                    <a
                        href="registro.html"
                        class="text-decoration-none fw-semibold register-link"
                    >
                        Registrate
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
