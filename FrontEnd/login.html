<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEM | Inicio de sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf6f1, #f7f2df);
        }

        .navbar-flem {
            background-color: #075c45;
        }

        .brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .symbol {
            color: #d4af37;
            font-size: 32px;
            margin-right: 8px;
        }

        .login-card {
            border: none;
            border-radius: 22px;
        }

        .medical-symbol {
            font-size: 65px;
            color: #d4af37;
        }

        .flem-title {
            color: #075c45;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .btn-flem {
            background-color: #075c45;
            color: white;
            border: none;
        }

        .btn-flem:hover {
            background-color: #064936;
            color: white;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-flem">
        <div class="container py-2">
            <span class="brand">
                <span class="symbol">⚕</span>FLEM
            </span>
        </div>
    </nav>

    <main class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <div class="card login-card shadow-lg">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <div class="medical-symbol">
                                ⚕
                            </div>

                            <h1 class="flem-title">
                                FLEM
                            </h1>

                            <p class="text-secondary">
                                Sistema Hospitalario
                            </p>

                        </div>

                 <form action="../BackEnd/login.php" method="POST">

                            <div class="mb-3">

                                <label for="correo" class="form-label fw-semibold">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    placeholder="ejemplo@correo.com"
                                    required
                                >

                            </div>

                            <div class="mb-4">

                                <label for="password" class="form-label fw-semibold">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Ingresá tu contraseña"
                                    required
                                >

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-flem btn-lg"
                                >
                                    Iniciar sesión
                                </button>

                            </div>

                        </form>

                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                ¿No tenés una cuenta?
                            </span>

                            <a
                                href="registro.html"
                                class="text-decoration-none fw-semibold"
                            >
                                Registrate
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
