<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEM | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #edf7f3, #f7f4e8);
        }

        .navbar-flem {
            background: #075c45;
        }

        .brand-symbol {
            color: #d4af37;
            font-size: 30px;
            margin-right: 8px;
        }

        .brand-name {
            color: white;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .register-card {
            border: none;
            border-radius: 22px;
        }

        .medical-symbol {
            font-size: 50px;
            color: #b8962e;
        }

        .flem-title {
            color: #075c45;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .btn-flem {
            background: #075c45;
            color: white;
            border: none;
        }

        .btn-flem:hover {
            background: #064936;
            color: white;
        }

        .form-control {
            padding: 11px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-flem">
        <div class="container py-2">

            <span class="navbar-brand mb-0">
                <span class="brand-symbol">⚕</span>
                <span class="brand-name">FLEM</span>
            </span>

        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="card register-card shadow-lg">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <div class="medical-symbol">
                                ⚕
                            </div>

                            <h1 class="flem-title">
                                Crear cuenta
                            </h1>

                            <p class="text-secondary">
                                Registro de paciente
                            </p>

                        </div>

         <form action="../BackEnd/registro.php" method="POST">

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label fw-semibold">
                                        Nombre
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="nombre"
                                        name="nombre"
                                        placeholder="Ingresá tu nombre"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label fw-semibold">
                                        Apellido
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="apellido"
                                        name="apellido"
                                        placeholder="Ingresá tu apellido"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="cedula" class="form-label fw-semibold">
                                        Cédula
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="cedula"
                                        name="cedula"
                                        placeholder="Ingresá tu cédula"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="edad" class="form-label fw-semibold">
                                        Edad
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="edad"
                                        name="edad"
                                        placeholder="Ingresá tu edad"
                                        min="0"
                                        max="120"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label fw-semibold">
                                        Teléfono
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="telefono"
                                        name="telefono"
                                        placeholder="Ingresá tu teléfono"
                                        required
                                    >
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="correo" class="form-label fw-semibold">
                                        Correo electrónico
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="correo"
                                        name="correo"
                                        placeholder="ejemplo@correo.com"
                                        required
                                    >
                                </div>

                                <div class="col-12 mb-4">
                                    <label for="password" class="form-label fw-semibold">
                                        Contraseña
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Ingresá una contraseña"
                                        required
                                    >
                                </div>

                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-flem btn-lg">
                                    Crear cuenta
                                </button>
                            </div>

                        </form>

                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                ¿Ya tenés una cuenta?
                            </span>

                            <a href="login.html" class="text-decoration-none fw-semibold">
                                Iniciá sesión
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
</html>
