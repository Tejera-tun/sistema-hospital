
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLEM | Registro de pacientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --verde: #075c45;
            --verde-oscuro: #064735;
            --dorado: #d4af37;
            --fondo: #f4f8f6;
        }

        body {
            min-height: 100vh;
            background: var(--fondo);
            font-family: Arial, sans-serif;
        }

        .navbar-flem {
            background: var(--verde);
            padding: 12px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            text-decoration: none;
        }

        .logo-hospital {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand-text {
            color: white;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .brand-text .flem,
        .brand-text .cruz {
            color: var(--dorado);
        }

        .brand-text small {
            display: block;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .register-container {
            padding: 45px 15px;
        }

        .register-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        .register-card .card-body {
            padding: 40px;
        }

        .medical-symbol {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #f8f1d9;
            color: var(--dorado);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin: 0 auto 18px;
        }

        .flem-title {
            color: var(--verde);
            font-weight: bold;
            letter-spacing: 4px;
        }

        .gold-line {
            width: 55px;
            height: 4px;
            background: var(--dorado);
            border-radius: 5px;
            margin: 15px auto 20px;
        }

        .form-label {
            color: #34443c;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #d8e1dc;
        }

        .form-control:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(7, 92, 69, .12);
        }

        .btn-flem {
            background: var(--verde);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 13px;
            font-weight: bold;
            transition: .2s;
        }

        .btn-flem:hover {
            background: var(--verde-oscuro);
            color: white;
        }

        .login-link {
            color: var(--verde);
        }

        .login-link:hover {
            color: var(--verde-oscuro);
            text-decoration: underline !important;
        }

        @media (max-width: 600px) {
            .logo-hospital {
                width: 38px;
                height: 38px;
            }

            .brand-text {
                font-size: 19px;
            }

            .brand-text small {
                font-size: 9px;
            }

            .register-card .card-body {
                padding: 25px 20px;
            }

            .register-container {
                padding: 25px 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-flem">
        <div class="container">

            <a href="login.html" class="brand">

                <img
                    src="img/logo-hospital-clinicas.png"
                    alt="Logo Hospital de Clínicas"
                    class="logo-hospital"
                >

                <span class="brand-text">
                    <span class="flem">FLEM</span><span class="cruz"> ×</span>
                    <small>HOSPITAL DE CLÍNICAS</small>
                </span>

            </a>

        </div>
    </nav>

    <main class="register-container">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-10 col-lg-8">

                    <div class="card register-card">

                        <div class="card-body">

                            <div class="text-center mb-4">

                                <div class="medical-symbol">
                                    ⚕
                                </div>

                                <h1 class="flem-title">
                                    Crear cuenta
                                </h1>

                                <div class="gold-line"></div>

                                <p class="text-secondary">
                                    Registro de paciente
                                </p>

                                <p class="text-secondary small">
                                    Completá tus datos para crear tu cuenta en el sistema.
                                </p>

                            </div>

                            <form action="../BackEnd/registro.php" method="POST">

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label for="nombre" class="form-label fw-semibold">
                                            Nombre
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="nombre"
                                            name="nombre"
                                            placeholder="Ingresá tu nombre"
                                            autocomplete="given-name"
                                            required
                                        >

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="apellido" class="form-label fw-semibold">
                                            Apellido
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="apellido"
                                            name="apellido"
                                            placeholder="Ingresá tu apellido"
                                            autocomplete="family-name"
                                            required
                                        >

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="cedula" class="form-label fw-semibold">
                                            Cédula
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="cedula"
                                            name="cedula"
                                            placeholder="Ingresá tu cédula"
                                            required
                                        >

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="edad" class="form-label fw-semibold">
                                            Edad
                                        </label>

                                        <input
                                            type="number"
                                            class="form-control"
                                            id="edad"
                                            name="edad"
                                            placeholder="Ingresá tu edad"
                                            min="0"
                                            max="120"
                                            required
                                        >

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="telefono" class="form-label fw-semibold">
                                            Teléfono
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="telefono"
                                            name="telefono"
                                            placeholder="Ingresá tu teléfono"
                                            autocomplete="tel"
                                            required
                                        >

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label for="correo" class="form-label fw-semibold">
                                            Correo electrónico
                                        </label>

                                        <input
                                            type="email"
                                            class="form-control"
                                            id="correo"
                                            name="correo"
                                            placeholder="ejemplo@correo.com"
                                            autocomplete="email"
                                            required
                                        >

                                    </div>

                                    <div class="col-12 mb-4">

                                        <label for="password" class="form-label fw-semibold">
                                            Contraseña
                                        </label>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="password"
                                            name="password"
                                            placeholder="Ingresá una contraseña"
                                            autocomplete="new-password"
                                            required
                                        >

                                    </div>

                                </div>

                                <div class="d-grid">

                                    <button type="submit" class="btn btn-flem btn-lg">
                                        Crear cuenta
                                    </button>

                                </div>

                            </form>

                            <div class="text-center mt-4">

                                <span class="text-secondary">
                                    ¿Ya tenés una cuenta?
                                </span>

                                <a
                                    href="login.html"
                                    class="text-decoration-none fw-semibold login-link"
                                >
                                    Iniciá sesión
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
